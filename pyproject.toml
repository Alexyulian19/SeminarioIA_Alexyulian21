[project]
name = "seminarioia-alexyulian21"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "S", "I"]

[tool.ruff.lint.per-file-ignores]
# S101: assert es la forma normal de comprobar en pytest.
"tests/*" = ["S101"]