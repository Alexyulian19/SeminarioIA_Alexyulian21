[project]
name = "seminarioia-alexyulian21"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "S", "I"]

[tool.ruff.lint.per-file-ignores]
# S101: assert es la forma normal de comprobar en pytest.
"tests/*" = ["S101"]
[tool.coverage.run]
# Cobertura de la lógica del negocio (carpeta app), con ramas.
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
