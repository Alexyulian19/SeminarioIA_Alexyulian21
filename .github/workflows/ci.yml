name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias fijadas
        run: pip install -r requirements-dev.txt
      - name: Linter
        run: ruff check .
      - name: Pruebas y cobertura
        run: pytest --cov --cov-fail-under=90

  contenedor:
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build -t urban-pruebas .
      - name: Correr las pruebas dentro del contenedor
        run: docker run --rm urban-pruebas